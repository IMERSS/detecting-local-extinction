title: Protocol for the detection of extirpation

# Language settings
contentDir: content
defaultContentLanguage: en
defaultContentLanguageInSubdir: false
# Useful when translating.

enableRobotsTXT: false

theme: "hextra"

relativeUrls: true
publishDir: docs

# Will give values to .Lastmod etc.
enableGitInfo: false

# The docs don't use tags or categories, so don't generate taxonomy listing pages
disableKinds: [taxonomy, term]

menu:
  # Mirrors the imerss.org main menu (IMERSS/imerss-org hugo.yaml), with links pointing
  # to imerss.org. Keep the two in step when the imerss.org menu changes.
  main:
    - identifier: home
      name: Home
      url: "https://imerss.org/"
      weight: 1
    - identifier: aboutus
      name: "About Us"
      url: "https://imerss.org/about/"
      weight: 2
    - identifier: team
      name: "Our Team"
      url: "https://imerss.org/team/"
      parent: aboutus
      weight: 1
    - identifier: work
      name: "Our Work"
      url: "https://imerss.org/work/"
      weight: 3
    - identifier: contributions
      name: "Contributions"
      url: "https://imerss.org/contributions/"
      parent: work
      weight: 1
    - identifier: media
      name: "Media"
      url: "https://imerss.org/media/"
      parent: work
      weight: 2
    - identifier: atlas
      name: "Atlas"
      url: "https://imerss.github.io/salish-sea-biodiversity/"
      weight: 4
    - identifier: involved
      name: "Get Involved"
      url: "https://imerss.org/involved/"
      weight: 5
    - identifier: donate
      name: Donate
      url: "https://imerss.org/donate/"
      weight: 7
    # This site's own "Docs" entry (weight 6, before Donate) comes from content/docs/_index.md
    - name: Search
      weight: 8
      params:
        type: search
    - name: GitHub
      weight: 9
      url: "https://github.com/IMERSS/detecting-local-extinction"
      params:
        icon: github

# Highlighting config
pygmentsCodeFences: true
pygmentsUseClasses: false
# Use the new Chroma Go highlighter in Hugo.
pygmentsUseClassic: false
# pygmentsOptions: "linenos=table"
# See https://help.farbox.com/pygments.html
pygmentsStyle: tango

# Image processing configuration.
imaging:
  resampleFilter: CatmullRom
  quality: 75
  anchor: smart

# Language configuration
languages:
  en:
    languageName: English
    title: IMERSS
    params:
      description: Advancing a protocol for the detection of extirpation

markup:
  goldmark:
    parser:
      attribute:
        block: true
    renderer:
      unsafe: true
    extensions:
      passthrough:
        enable: true
        delimiters:
          inline: [['\(', '\)']]
  highlight:
    # See a complete list of available styles at https://xyproto.github.io/splash/docs/all.html
    style: tango
    # Uncomment if you want your chosen highlight style used for code blocks without a specified language
    # guessSyntax: true

# Everything below this are Site Params

outputs:
  section: [HTML, RSS]

params:
  katex:
    enable: true
    options:
      delimiters:
        - left: \(
          right: \)
          display: false
  navbar:
    logo:
      width: 35
      height: 30

  # Footer matches imerss.org (IMERSS/imerss-org hugo.yaml); the copyright line is in i18n/en.yaml
  footer:
    enable: true
    displayCopyright: true
    displayPoweredBy: true
    width: normal
